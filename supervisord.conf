[unix_http_server]
file=/tmp/xblock-supervisor.sock

[supervisord]
logfile=/home/aendra/xblock-docker/logs/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=/tmp/xblock-supervisord.pid
nodaemon=false

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/xblock-supervisor.sock

[program:xblock-worker]
command=/home/aendra/.pyenv/versions/xblock/bin/python /home/aendra/xblock-docker/processor/worker.py
directory=/home/aendra/xblock-docker/processor
autostart=true
autorestart=true
startretries=10
startsecs=15
stopwaitsecs=30
stdout_logfile=/home/aendra/xblock-docker/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
redirect_stderr=true
environment=HOME="/home/aendra",PATH="/home/aendra/.pyenv/versions/xblock/bin:/home/aendra/.pyenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:xblock-watchdog]
command=/home/aendra/.pyenv/versions/xblock/bin/python /home/aendra/xblock-docker/processor/watchdog.py
directory=/home/aendra/xblock-docker/processor
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/home/aendra/xblock-docker/logs/watchdog.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=HOME="/home/aendra",PATH="/home/aendra/.pyenv/versions/xblock/bin:/home/aendra/.pyenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:xblock-trim]
; Enforces the MAX_JOB_AGE_HOURS bound on the queue. Without something running
; this on a schedule the age bound is only a promise, and the Redis instance
; cannot be sized against it. Hourly is ample: the queue only grows while the
; worker is down.
command=/home/aendra/.pyenv/versions/xblock/bin/python /home/aendra/xblock-docker/processor/trim_queue.py --apply --interval 3600
directory=/home/aendra/xblock-docker/processor
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/home/aendra/xblock-docker/logs/trim.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=HOME="/home/aendra",PATH="/home/aendra/.pyenv/versions/xblock/bin:/home/aendra/.pyenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

[program:xblock-dashboard]
command=/home/aendra/.pyenv/versions/xblock/bin/uvicorn dashboard:app --host 0.0.0.0 --port 8080 --log-level warning --loop asyncio
directory=/home/aendra/xblock-docker/processor
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/home/aendra/xblock-docker/logs/dashboard.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=HOME="/home/aendra",PATH="/home/aendra/.pyenv/versions/xblock/bin:/home/aendra/.pyenv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
; Redis tunnel from Love to the queue box in Nuremberg. Live since the cutover
; on 2 September 2026.
;
; The worker reaches Redis through the LOCAL end of this tunnel:
;     processor/.env  REDIS_CONNECTION_STRING=redis://:<pass>@127.0.0.1:6380
;
; Local port is 6380, NOT 6379, because Love runs its own redis-server on 6379.
; Binding there fails with "Address already in use" -- and because Redis on the
; queue box requires a password while Love's local one does not, an
; unauthenticated PING returning NOAUTH is the proof you are talking to the
; right instance.
;
; Why a tunnel at all: Redis used to be a public port guarded by a
; security-group IP allowlist, which silently stops working whenever the home IP
; changes. The tunnel removes Redis from the internet entirely -- on the queue
; box it binds to loopback and WireGuard only, so this is the sole path in,
; authenticated by the SSH key and then by requirepass.
;
; Why SSH rather than WireGuard: WireGuard would need root on Love to install
; wireguard-tools and bring up the interface, and sudo here is password-gated.
; This needs no privileges at all -- and supervisord is already supervising
; three other things, so it provides the restart loop that autossh would.
; The kernel module IS available if you would rather have WireGuard later;
; infra/setup-queue.sh already configures the server side for it.
;
; ExitOnForwardFailure matters: without it, ssh happily connects with a dead
; forward and the worker fails against a port that nothing is listening on.

[program:xblock-redis-tunnel]
command=/usr/bin/ssh -N
    -i /home/aendra/.ssh/xblock-hetzner
    -o IdentitiesOnly=yes
    -o BatchMode=yes
    -o ExitOnForwardFailure=yes
    -o ServerAliveInterval=15
    -o ServerAliveCountMax=3
    -o StrictHostKeyChecking=accept-new
    -L 6380:127.0.0.1:6379
    xblock@178.105.48.14
directory=/home/aendra
autostart=true
autorestart=true
startretries=100
; ssh exits immediately on a refused connection; require it to survive long
; enough that a restart storm is visible as a restart storm.
startsecs=10
stopwaitsecs=10
stdout_logfile=/home/aendra/xblock-docker/logs/redis-tunnel.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
environment=HOME="/home/aendra",PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
; The worker must not start before the tunnel; supervisord has no dependency
; graph, so the worker's own Redis retry loop is what covers the gap.
priority=100
